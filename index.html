<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dad Joke Goblin</title>

  <style>
    :root {
      --pink: #ff4fd8;
      --yellow: #fff04a;
      --green: #39ff88;
      --blue: #42d9ff;
      --purple: #a855f7;
      --black: #060608;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Comic Sans MS", "Comic Sans", Arial, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 79, 216, 0.45), transparent 25%),
        radial-gradient(circle at 80% 10%, rgba(57, 255, 136, 0.35), transparent 25%),
        radial-gradient(circle at 50% 100%, rgba(66, 217, 255, 0.35), transparent 35%),
        linear-gradient(135deg, #08080c, #1b1029, #09090f);
      overflow-x: hidden;
      padding: 16px;
    }

    .chaos-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .floater {
      position: absolute;
      font-size: clamp(1.6rem, 4vw, 4rem);
      opacity: 0.16;
      animation: floaty 9s infinite ease-in-out;
      user-select: none;
    }

    @keyframes floaty {
      0% { transform: translateY(0) rotate(0deg) scale(1); }
      50% { transform: translateY(-30px) rotate(18deg) scale(1.2); }
      100% { transform: translateY(0) rotate(0deg) scale(1); }
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }

    .card {
      position: relative;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
      border: 5px solid var(--yellow);
      border-radius: 36px;
      padding: clamp(22px, 5vw, 46px);
      text-align: center;
      box-shadow:
        0 0 0 8px rgba(255, 79, 216, 0.25),
        0 35px 100px rgba(0, 0, 0, 0.62);
      overflow: hidden;
    }

    .card::before {
      content: "ABSOLUTE NONSENSE MACHINE";
      position: absolute;
      top: 18px;
      left: -75px;
      transform: rotate(-35deg);
      background: var(--green);
      color: #08110b;
      font-weight: 1000;
      padding: 10px 85px;
      font-size: 0.78rem;
      letter-spacing: 1px;
    }

    .card::after {
      content: "100% DAD-POWERED";
      position: absolute;
      bottom: 22px;
      right: -65px;
      transform: rotate(-25deg);
      background: var(--pink);
      color: white;
      font-weight: 1000;
      padding: 10px 75px;
      font-size: 0.78rem;
      letter-spacing: 1px;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 8rem);
      line-height: 0.86;
      letter-spacing: -4px;
      text-shadow:
        5px 5px 0 #ff4fd8,
        10px 10px 0 #42d9ff,
        15px 15px 0 rgba(0,0,0,0.45);
      transform: rotate(-2deg);
    }

    .subtitle {
      margin: 24px auto 0;
      max-width: 720px;
      color: #f7f7f7;
      font-size: clamp(1rem, 3vw, 1.35rem);
      line-height: 1.45;
      font-weight: 800;
    }

    .joke-box {
      position: relative;
      margin: 34px auto;
      min-height: 250px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        repeating-linear-gradient(
          45deg,
          rgba(255, 240, 74, 0.13),
          rgba(255, 240, 74, 0.13) 12px,
          rgba(255, 79, 216, 0.13) 12px,
          rgba(255, 79, 216, 0.13) 24px
        ),
        rgba(0,0,0,0.48);
      border: 4px dashed var(--green);
      border-radius: 30px;
      padding: clamp(22px, 5vw, 40px);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.45);
    }

    .joke-box::before {
      content: "🚨 DAD DAMAGE DETECTED 🚨";
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%) rotate(1deg);
      background: var(--yellow);
      color: #111;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 1000;
      font-size: 0.82rem;
      white-space: nowrap;
      border: 3px solid black;
    }

    #joke {
      margin: 0;
      font-size: clamp(1.45rem, 5vw, 3.2rem);
      line-height: 1.18;
      font-weight: 1000;
      color: white;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.65);
    }

    .button-wrap {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    #bigButton {
      position: relative;
      width: min(100%, 620px);
      min-height: 120px;
      border: 6px solid black;
      border-radius: 999px;
      cursor: pointer;
      background:
        radial-gradient(circle at 30% 20%, #fff, transparent 14%),
        linear-gradient(135deg, var(--yellow), #ff8a00, var(--pink));
      color: #101010;
      font-size: clamp(1.4rem, 6vw, 3.4rem);
      font-weight: 1000;
      font-family: inherit;
      box-shadow:
        0 16px 0 #6d2400,
        0 30px 60px rgba(0,0,0,0.55);
      transform: rotate(1deg);
      transition: 0.12s ease;
      text-transform: uppercase;
    }

    #bigButton:hover {
      transform: rotate(-1deg) scale(1.025);
      filter: saturate(1.3);
    }

    #bigButton:active {
      transform: translateY(12px) scale(0.98);
      box-shadow:
        0 4px 0 #6d2400,
        0 16px 38px rgba(0,0,0,0.45);
    }

    .stats {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pill {
      background: rgba(0,0,0,0.42);
      border: 3px solid rgba(255,255,255,0.22);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 900;
      color: white;
      font-size: 0.92rem;
    }

    .mini-panel {
      background: rgba(0,0,0,0.36);
      border: 3px solid rgba(255,255,255,0.16);
      border-radius: 26px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 20px 55px rgba(0,0,0,0.35);
    }

    .mini-panel h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      color: var(--yellow);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #history {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #history li {
      background: rgba(255,255,255,0.09);
      border: 2px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      padding: 12px;
      font-size: 0.95rem;
      line-height: 1.35;
      color: #f4f4f5;
    }

    .shake {
      animation: shake 0.35s linear;
    }

    @keyframes shake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-8px, 4px) rotate(-1deg); }
      40% { transform: translate(8px, -4px) rotate(1deg); }
      60% { transform: translate(-6px, 3px) rotate(-1deg); }
      80% { transform: translate(6px, -3px) rotate(1deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .burp {
      position: fixed;
      z-index: 50;
      font-size: 2.5rem;
      pointer-events: none;
      animation: pop 1s ease forwards;
    }

    @keyframes pop {
      0% {
        opacity: 0;
        transform: scale(0.4) rotate(0deg);
      }
      25% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-120px) scale(1.8) rotate(25deg);
      }
    }

    @media (max-width: 600px) {
      .card {
        border-radius: 26px;
        border-width: 4px;
      }

      .card::before,
      .card::after {
        display: none;
      }

      #bigButton {
        min-height: 105px;
      }

      .joke-box {
        min-height: 230px;
      }
    }
  </style>
</head>

<body>
  <div class="chaos-bg" id="chaosBg"></div>

  <main class="page" id="page">
    <section class="card">
      <h1>Dad Joke<br>Goblin</h1>

      <p class="subtitle">
        One button. Infinite nonsense. Questionable taste. Zero apology.
      </p>

      <section class="joke-box">
        <p id="joke">
          Press the big stupid button and receive verbal diarrhoea.
        </p>
      </section>

      <div class="button-wrap">
        <button id="bigButton">SUMMON A RUDE DAD JOKE</button>
      </div>

      <div class="stats">
        <div class="pill">Jokes fired: <span id="count">0</span></div>
        <div class="pill">Source: <span id="source">Goblin idle</span></div>
        <div class="pill">Cringe level: <span id="cringe">0%</span></div>
      </div>
    </section>

    <section class="mini-panel">
      <h2>Recent emotional damage</h2>
      <ul id="history"></ul>
    </section>
  </main>

  <script>
    "use strict";

    const jokeEl = document.getElementById("joke");
    const countEl = document.getElementById("count");
    const sourceEl = document.getElementById("source");
    const cringeEl = document.getElementById("cringe");
    const historyEl = document.getElementById("history");
    const bigButton = document.getElementById("bigButton");
    const page = document.getElementById("page");
    const chaosBg = document.getElementById("chaosBg");

    let count = Number(localStorage.getItem("goblin_joke_count")) || 0;
    let history = safeJsonParse(localStorage.getItem("goblin_joke_history"), []);

    const chaosEmojis = [
      "🤡", "💩", "🧀", "🧦", "🦆", "🔥", "🥴", "👹", "🍕", "🪠",
      "🚽", "🧃", "🦷", "🧻", "🐸", "🥔", "🦀", "🧅", "🎺", "🫠"
    ];

    const rudeLocalJokes = [
      "I told my wallet I needed support. It said, “Mate, I’m emptier than your promises.”",
      "My toilet and I have a lot in common. We both deal with my crap daily.",
      "I asked my fridge for advice. It said, “Stop opening me like I have answers, you absolute snack gremlin.”",
      "I tried to flirt with my Wi-Fi. It said the connection was weak and emotionally unavailable.",
      "My bank account ghosted me. Honestly, I respect the boundaries.",
      "I told my alarm clock it was annoying. It said, “I’m not the one wasting his life in bed, champ.”",
      "My printer has started therapy because I keep asking it to work under pressure.",
      "I bought a camouflage jacket, but I can’t see myself wearing it. Which is still better than seeing my life choices.",
      "I asked my mirror for honesty. It said, “Legally, I cannot say that out loud.”",
      "My socks left me. Apparently even they could smell the relationship was dead.",
      "I told my sofa I needed space. It said, “You’ve been spreading across me for years, you furniture parasite.”",
      "My phone battery dies faster than my motivation on a Monday morning.",
      "I asked my calendar for a break. It scheduled a breakdown and invited my anxiety.",
      "I tried being mature once. Worst 14 seconds of my life.",
      "My diet plan and my printer have one thing in common: both jam when things get serious.",
      "I told my search history I was proud of it. It deleted itself out of shame.",
      "My common sense packed a bag and left. It said it was tired of working unpaid overtime.",
      "I asked my microwave if I was hot. It said, “Only in short, disappointing bursts.”",
      "My group chat has more red flags than a budget circus.",
      "I went to buy inner peace, but my card was declined for suspicious optimism.",
      "My gym membership said it misses me. Bit clingy for something I ignore professionally.",
      "I tried to make a clean joke, but then my personality walked in wearing muddy shoes.",
      "My motivation is like cheap toilet paper: thin, unreliable, and gone when needed.",
      "I asked my coffee if it believed in me. It said, “I’m a drink, not a miracle worker.”",
      "My cooking is so bad the smoke alarm has started seasoning itself.",
      "I told my laundry basket I’d deal with it tomorrow. It laughed and evolved into furniture.",
      "My password manager judged me so hard it suggested therapy as a security question.",
      "I asked my suitcase if I was ready for travel. It said, “You pack like a raccoon having a panic attack.”",
      "My car insurance costs so much it should legally call me beautiful.",
      "I bought noise-cancelling headphones so I could finally ignore my own bad decisions in HD."
    ];

    const templates = [
      () => "I tried talking to " + pick([
        "my fridge", "my wallet", "my alarm clock", "my mirror", "my sofa",
        "my phone", "my microwave", "my printer", "my Wi-Fi", "my calendar"
      ]) + ", but it " + pick([
        "filed a complaint", "blocked my number", "asked for space",
        "called me a liability", "sent me an invoice", "left me on read",
        "reported me to customer service", "changed the locks"
      ]) + ". " + pick([
        "Honestly, fair.",
        "I was offended until I saw the evidence.",
        "That hurt, but the delivery was excellent.",
        "The warranty covers everything except my dignity.",
        "I wanted closure. It gave me a tracking number.",
        "That is not a red flag. That is a whole fire station."
      ]),

      () => "My " + pick([
        "bank account", "motivation", "sleep schedule", "common sense",
        "left sock", "diet plan", "life plan", "patience"
      ]) + " is like " + pick([
        "a cheap umbrella", "a supermarket self-checkout", "public Wi-Fi",
        "hotel soap", "a suspicious kebab", "a wet cardboard box"
      ]) + ": " + pick([
        "technically present, but nobody trusts it.",
        "collapses under the slightest pressure.",
        "mostly disappointing and smells faintly of regret.",
        "works until you actually need it.",
        "somehow worse after midnight.",
        "an insult to engineering and dignity."
      ]),

      () => pick(rudeLocalJokes)
    ];

    function safeJsonParse(value, fallback) {
      try {
        return value ? JSON.parse(value) : fallback;
      } catch {
        return fallback;
      }
    }

    function pick(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function createFloaters() {
      for (let i = 0; i < 34; i++) {
        const span = document.createElement("span");
        span.className = "floater";
        span.textContent = pick(chaosEmojis);
        span.style.left = Math.random() * 100 + "%";
        span.style.top = Math.random() * 100 + "%";
        span.style.animationDelay = (Math.random() * 8) + "s";
        span.style.animationDuration = (7 + Math.random() * 8) + "s";
        chaosBg.appendChild(span);
      }
    }

    function burpExplosion() {
      for (let i = 0; i < 10; i++) {
        const span = document.createElement("span");
        span.className = "burp";
        span.textContent = pick(chaosEmojis);
        span.style.left = (20 + Math.random() * 60) + "vw";
        span.style.top = (35 + Math.random() * 30) + "vh";
        document.body.appendChild(span);

        setTimeout(() => {
          span.remove();
        }, 1000);
      }
    }

    function saveJoke(joke, source) {
      jokeEl.textContent = joke;
      sourceEl.textContent = source;

      count += 1;
      countEl.textContent = count;
      localStorage.setItem("goblin_joke_count", String(count));

      const cringe = Math.floor(69 + Math.random() * 31);
      cringeEl.textContent = cringe + "%";

      history.unshift(joke);
      history = history.slice(0, 6);
      localStorage.setItem("goblin_joke_history", JSON.stringify(history));

      renderHistory();

      page.classList.remove("shake");
      void page.offsetWidth;
      page.classList.add("shake");

      burpExplosion();
    }

    function localRudeJoke() {
      saveJoke(pick(templates)(), "Local goblin brain");
    }

    async function getApiJoke() {
      const randomChoice = Math.random();

      try {
        if (randomChoice < 0.5) {
          const res = await fetch("https://icanhazdadjoke.com/", {
            headers: { "Accept": "application/json" }
          });

          if (!res.ok) throw new Error("Dad API failed");

          const data = await res.json();

          if (!data.joke) throw new Error("No joke");

          saveJoke(data.joke + " Still less embarrassing than your browser history.", "Free dad joke API");
          return;
        }

        const res = await fetch("https://official-joke-api.appspot.com/random_joke");

        if (!res.ok) throw new Error("Official API failed");

        const data = await res.json();

        if (!data.setup || !data.punchline) throw new Error("No joke");

        saveJoke(data.setup + " " + data.punchline + " Filthy behaviour from a grown website.", "Official Joke API");
      } catch {
        localRudeJoke();
      }
    }

    function summonJoke() {
      bigButton.disabled = true;
      bigButton.textContent = pick([
        "COOKING NONSENSE...",
        "LOADING CRINGE...",
        "SUMMONING GOBLIN...",
        "REHEATING BAD IDEAS...",
        "OPENING THE DAD PORTAL..."
      ]);

      setTimeout(() => {
        const useApi = Math.random() < 0.28;

        if (useApi) {
          getApiJoke().finally(() => resetButton());
        } else {
          localRudeJoke();
          resetButton();
        }
      }, 420);
    }

    function resetButton() {
      bigButton.disabled = false;
      bigButton.textContent = pick([
        "SUMMON ANOTHER RUDE DAD JOKE",
        "HIT ME AGAIN, GOBLIN",
        "MORE VERBAL DIARRHOEA",
        "DEPLOY THE CRINGE CANNON",
        "PRESS FOR NONSENSE"
      ]);
    }

    function renderHistory() {
      historyEl.innerHTML = "";

      if (history.length === 0) {
        const li = document.createElement("li");
        li.textContent = "No damage yet. The public remains safe.";
        historyEl.appendChild(li);
        return;
      }

      history.forEach(joke => {
        const li = document.createElement("li");
        li.textContent = joke;
        historyEl.appendChild(li);
      });
    }

    bigButton.addEventListener("click", summonJoke);

    document.addEventListener("keydown", function(event) {
      if (event.code === "Space" || event.code === "Enter") {
        event.preventDefault();
        summonJoke();
      }
    });

    countEl.textContent = count;
    createFloaters();
    renderHistory();
  </script>
</body>
</html>
